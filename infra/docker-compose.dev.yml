services:
  postgres:
    image: postgres:16-alpine
    container_name: maqueta-tienda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: password
      POSTGRES_DB: maqueta_tienda
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: maqueta-tienda-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  postgres_data:
